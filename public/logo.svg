<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="50%" style="stop-color:#d97706"/>
      <stop offset="100%" style="stop-color:#b45309"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Chart bars -->
  <rect x="100" y="320" width="48" height="80" rx="8" fill="url(#gold)" opacity="0.4"/>
  <rect x="172" y="270" width="48" height="130" rx="8" fill="url(#gold)" opacity="0.55"/>
  <rect x="244" y="220" width="48" height="180" rx="8" fill="url(#gold)" opacity="0.7"/>
  <rect x="316" y="180" width="48" height="220" rx="8" fill="url(#gold)" opacity="0.85"/>
  <rect x="388" y="140" width="48" height="260" rx="8" fill="url(#gold)"/>
  <!-- Trend line -->
  <polyline points="124,300 196,255 268,210 340,170 412,125" fill="none" stroke="url(#goldLight)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow tip -->
  <polygon points="412,125 430,115 420,140" fill="#fbbf24"/>
  <!-- T letter -->
  <text x="256" y="115" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="80" fill="#fbbf24" opacity="0.9">T</text>
</svg>
